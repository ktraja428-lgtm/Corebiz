<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoreBiz - Calculator</title>
<meta name="theme-color" content="#0F172A">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F172A;color:#fff;font-family:system-ui,sans-serif;min-height:100vh}
</style>
</head>
<body>
<div id="authGate" style="position:fixed;inset:0;background:#0F172A;color:#fff;display:flex;align-items:center;justify-content:center;z-index:99999;font-size:14px;">Checking login...</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDJRsJMU-jfy2iQoZsCVZGmyMT-l9mEMf8",
    authDomain: "corebiz-f7762.firebaseapp.com",
    projectId: "corebiz-f7762",
    storageBucket: "corebiz-f7762.firebasestorage.app",
    messagingSenderId: "928975624139",
    appId: "1:928975624139:web:c24e248984883a3a3O484e",
    measurementId: "G-33FSED87HM"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  onAuthStateChanged(auth, (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    const gate = document.getElementById('authGate'); if (gate) gate.style.display = 'none';
  });
</script>

<div id="root"></div>

<script type="text/babel">
const S = {
  card:{background:"#1E293B",borderRadius:12,padding:"14px",border:"1px solid #334155",marginBottom:12},
  input:{width:"100%",background:"#0F172A",border:"1px solid #334155",color:"#fff",padding:"10px 12px",borderRadius:8,fontSize:14,marginBottom:10},
  label:{fontSize:12,color:"#94A3B8",display:"block",marginBottom:5},
  btnGhost:{background:"#0F172A",border:"1px solid #334155",borderRadius:9,padding:"12px",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer",width:"100%"}
};
const GST_RATES=[5,12,18,28];

function GSTCalc(){
  const[amount,setAmount]=React.useState('');
  const[rate,setRate]=React.useState(18);
  const[mode,setMode]=React.useState('add');

  const amt=Number(amount)||0;
  let base=0,gstAmt=0,total=0;
  if(mode==='add'){
    base=amt;
    gstAmt=base*rate/100;
    total=base+gstAmt;
  }else{
    total=amt;
    base=total/(1+rate/100);
    gstAmt=total-base;
  }

  return(
    <div>
      <div style={S.card}>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <button onClick={()=>setMode('add')} style={{...S.btnGhost,background:mode==='add'?"#F59E0B":"#0F172A",color:mode==='add'?"#0F172A":"#94A3B8",fontWeight:800}}>GST Jodo</button>
          <button onClick={()=>setMode('remove')} style={{...S.btnGhost,background:mode==='remove'?"#F59E0B":"#0F172A",color:mode==='remove'?"#0F172A":"#94A3B8",fontWeight:800}}>GST Nikalo</button>
        </div>
        <div style={{fontSize:11,color:"#64748B",marginBottom:10}}>
          {mode==='add'?"Amount bina GST ke daalo, total nikalega":"Amount GST ke saath daalo, base nikalega"}
        </div>
        <label style={S.label}>{mode==='add'?"Amount (bina GST)":"Total Amount (GST samet)"}</label>
        <input type="number" style={S.input} value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0"/>
        <label style={S.label}>GST Rate</label>
        <div style={{display:"flex",gap:6,marginBottom:10}}>
          {GST_RATES.map(r=>(
            <button key={r} onClick={()=>setRate(r)} style={{flex:1,padding:"8px",borderRadius:8,border:"none",cursor:"pointer",background:rate===r?"#F59E0B":"#0F172A",color:rate===r?"#0F172A":"#94A3B8",fontWeight:700,fontSize:13}}>{r}%</button>
          ))}
        </div>
      </div>

      <div style={S.card}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6,color:"#94A3B8"}}>
          <span>Base Amount</span><span>₹{base.toFixed(2)}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6,color:"#94A3B8"}}>
          <span>GST ({rate}%)</span><span>₹{gstAmt.toFixed(2)}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:18,fontWeight:900,marginTop:6,borderTop:"1px solid #334155",paddingTop:8}}>
          <span>Total</span><span style={{color:"#F59E0B"}}>₹{total.toFixed(2)}</span>
        </div>
      </div>
    </div>
  );
}

function EMICalc(){
  const[principal,setPrincipal]=React.useState('');
  const[rate,setRate]=React.useState('');
  const[months,setMonths]=React.useState('');

  const P=Number(principal)||0;
  const annualRate=Number(rate)||0;
  const N=Number(months)||0;
  const r=annualRate/12/100;

  let emi=0,totalPay=0,totalInterest=0;
  if(P>0&&r>0&&N>0){
    emi=(P*r*Math.pow(1+r,N))/(Math.pow(1+r,N)-1);
    totalPay=emi*N;
    totalInterest=totalPay-P;
  }

  return(
    <div>
      <div style={S.card}>
        <label style={S.label}>Loan Amount ₹</label>
        <input type="number" style={S.input} value={principal} onChange={e=>setPrincipal(e.target.value)} placeholder="Jaise: 100000"/>
        <label style={S.label}>Interest Rate (saalana %)</label>
        <input type="number" style={S.input} value={rate} onChange={e=>setRate(e.target.value)} placeholder="Jaise: 12"/>
        <label style={S.label}>Tenure (mahine)</label>
        <input type="number" style={S.input} value={months} onChange={e=>setMonths(e.target.value)} placeholder="Jaise: 12"/>
      </div>

      <div style={S.card}>
        <div style={{textAlign:"center",marginBottom:12}}>
          <div style={{fontSize:11,color:"#64748B",marginBottom:4}}>Monthly EMI</div>
          <div style={{fontSize:28,fontWeight:900,color:"#F59E0B"}}>₹{emi?emi.toFixed(0):'0'}</div>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6,color:"#94A3B8"}}>
          <span>Total Byaj (Interest)</span><span>₹{totalInterest.toFixed(0)}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"#94A3B8"}}>
          <span>Total Bharna Hai</span><span>₹{totalPay.toFixed(0)}</span>
        </div>
      </div>
    </div>
  );
}

function App(){
  const[tab,setTab]=React.useState('gst');
  return(
    <div style={{minHeight:"100vh",background:"#0F172A",padding:14,maxWidth:500,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div style={{fontSize:20,fontWeight:900,color:"#F59E0B"}}>🧮 Calculator</div>
        <a href="index.html" style={{color:"#64748B",fontSize:13,textDecoration:"none"}}>← Wapas</a>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <button onClick={()=>setTab('gst')} style={{flex:1,padding:"10px",borderRadius:9,border:"none",cursor:"pointer",background:tab==='gst'?"#F59E0B":"#1E293B",color:tab==='gst'?"#0F172A":"#94A3B8",fontWeight:800,fontSize:14}}>GST</button>
        <button onClick={()=>setTab('emi')} style={{flex:1,padding:"10px",borderRadius:9,border:"none",cursor:"pointer",background:tab==='emi'?"#F59E0B":"#1E293B",color:tab==='emi'?"#0F172A":"#94A3B8",fontWeight:800,fontSize:14}}>EMI</button>
      </div>

      {tab==='gst'?<GSTCalc/>:<EMICalc/>}
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
