<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoreBiz - Hisaab</title>
<meta name="theme-color" content="#0F172A">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F172A;color:#fff;font-family:system-ui,sans-serif;min-height:100vh}
</style>
</head>
<body>
<div id="authGate" style="position:fixed;inset:0;background:#0F172A;color:#fff;display:flex;align-items:center;justify-content:center;z-index:99999;font-size:14px;">Checking login...</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import { getFirestore, doc, deleteDoc, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDJRsJMU-jfy2iQoZsCVZGmyMT-l9mEMf8",
    authDomain: "corebiz-f7762.firebaseapp.com",
    projectId: "corebiz-f7762",
    storageBucket: "corebiz-f7762.firebasestorage.app",
    messagingSenderId: "928975624139",
    appId: "1:928975624139:web:c24e248984883a3a3O484e",
    measurementId: "G-33FSED87HM"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  window.CB_DB = db;
  window.CB_DOC = doc; window.CB_DELDOC = deleteDoc;
  window.CB_COL = collection; window.CB_GETDOCS = getDocs; window.CB_ADDDOC = addDoc; window.CB_TS = serverTimestamp;
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    window.CB_UID = user.uid;
    const gate = document.getElementById('authGate'); if (gate) gate.style.display = 'none';
    window.CB_READY = true;
    window.dispatchEvent(new Event('cbReady'));
  });
</script>

<div id="root"></div>

<script type="text/babel">
const S = {
  card:{background:"#1E293B",borderRadius:12,padding:"14px",border:"1px solid #334155",marginBottom:12},
  input:{width:"100%",background:"#0F172A",border:"1px solid #334155",color:"#fff",padding:"10px 12px",borderRadius:8,fontSize:14,marginBottom:10},
  label:{fontSize:12,color:"#94A3B8",display:"block",marginBottom:5},
  btn:{background:"#F59E0B",border:"none",borderRadius:9,padding:"12px",color:"#0F172A",fontWeight:800,fontSize:14,cursor:"pointer",width:"100%"},
  btnGhost:{background:"#0F172A",border:"1px solid #334155",borderRadius:9,padding:"12px",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer",width:"100%"}
};

function todayStr(){
  const d=new Date();
  return d.toISOString().slice(0,10);
}

function formatDate(dstr){
  const d=new Date(dstr);
  return `${d.getDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]}`;
}

function App(){
  const[ready,setReady]=React.useState(!!window.CB_READY);
  const[entries,setEntries]=React.useState([]);
  const[type,setType]=React.useState('income');
  const[amount,setAmount]=React.useState('');
  const[desc,setDesc]=React.useState('');
  const[date,setDate]=React.useState(todayStr());
  const[saving,setSaving]=React.useState(false);

  React.useEffect(()=>{
    function init(){ loadEntries(); }
    if(window.CB_READY) init();
    else window.addEventListener('cbReady',init,{once:true});
  },[]);

  async function loadEntries(){
    try{
      const snap=await window.CB_GETDOCS(window.CB_COL(window.CB_DB,'users',window.CB_UID,'transactions'));
      const list=[];
      snap.forEach(d=>list.push({id:d.id,...d.data()}));
      list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      setEntries(list);
    }catch(e){}
    setReady(true);
  }

  async function addEntry(){
    if(!amount||Number(amount)<=0){alert('Sahi amount daalo.');return;}
    if(!desc.trim()){alert('Description daalo — jaise "Aaj ki bikri" ya "Rent".');return;}
    setSaving(true);
    try{
      await window.CB_ADDDOC(window.CB_COL(window.CB_DB,'users',window.CB_UID,'transactions'),{
        type, amount:Number(amount), description:desc.trim(), date, createdAt:window.CB_TS()
      });
      setAmount(''); setDesc(''); setDate(todayStr());
      await loadEntries();
    }catch(e){alert('Save nahi hua: '+e.message);}
    setSaving(false);
  }

  async function deleteEntry(id){
    if(!confirm('Ye entry hatani hai?'))return;
    try{
      await window.CB_DELDOC(window.CB_DOC(window.CB_DB,'users',window.CB_UID,'transactions',id));
      loadEntries();
    }catch(e){alert('Delete nahi hua.');}
  }

  const totalIncome=entries.filter(e=>e.type==='income').reduce((s,e)=>s+(Number(e.amount)||0),0);
  const totalExpense=entries.filter(e=>e.type==='expense').reduce((s,e)=>s+(Number(e.amount)||0),0);
  const net=totalIncome-totalExpense;

  if(!ready) return <div style={{padding:20,textAlign:"center",color:"#64748B"}}>Loading...</div>;

  return(
    <div style={{minHeight:"100vh",background:"#0F172A",padding:14,maxWidth:500,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div style={{fontSize:20,fontWeight:900,color:"#F59E0B"}}>💰 Hisaab</div>
        <a href="index.html" style={{color:"#64748B",fontSize:13,textDecoration:"none"}}>← Wapas</a>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
        <div style={S.card}>
          <div style={{fontSize:10,color:"#64748B",marginBottom:4}}>Kul Kamai</div>
          <div style={{fontSize:18,fontWeight:800,color:"#10B981"}}>₹{totalIncome.toLocaleString('en-IN')}</div>
        </div>
        <div style={S.card}>
          <div style={{fontSize:10,color:"#64748B",marginBottom:4}}>Kul Kharcha</div>
          <div style={{fontSize:18,fontWeight:800,color:"#F87171"}}>₹{totalExpense.toLocaleString('en-IN')}</div>
        </div>
      </div>

      <div style={{...S.card,textAlign:"center",marginBottom:12}}>
        <div style={{fontSize:11,color:"#64748B",marginBottom:4}}>Bacha (Munafa)</div>
        <div style={{fontSize:26,fontWeight:900,color:net>=0?"#10B981":"#F87171"}}>₹{net.toLocaleString('en-IN')}</div>
      </div>

      <div style={S.card}>
        <div style={{fontSize:14,fontWeight:800,marginBottom:10}}>Nayi Entry</div>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <button onClick={()=>setType('income')} style={{...S.btnGhost,background:type==='income'?"#10B981":"#0F172A",color:type==='income'?"#fff":"#94A3B8",border:type==='income'?"none":"1px solid #334155",fontWeight:800}}>💵 Kamai</button>
          <button onClick={()=>setType('expense')} style={{...S.btnGhost,background:type==='expense'?"#F87171":"#0F172A",color:type==='expense'?"#fff":"#94A3B8",border:type==='expense'?"none":"1px solid #334155",fontWeight:800}}>💸 Kharcha</button>
        </div>
        <label style={S.label}>Amount ₹</label>
        <input type="number" style={S.input} value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0"/>
        <label style={S.label}>Kis Cheez Ka</label>
        <input style={S.input} value={desc} onChange={e=>setDesc(e.target.value)} placeholder={type==='income'?"Jaise: Aaj ki bikri":"Jaise: Dukaan ka kiraya"}/>
        <label style={S.label}>Date</label>
        <input type="date" style={S.input} value={date} onChange={e=>setDate(e.target.value)}/>
        <button style={S.btn} onClick={addEntry} disabled={saving}>{saving?"Save ho raha hai...":"Entry Jodo"}</button>
      </div>

      <div style={S.card}>
        <div style={{fontSize:14,fontWeight:800,marginBottom:10}}>Sab Entries</div>
        {entries.length===0 && (
          <div style={{textAlign:"center",color:"#475569",fontSize:12,padding:10}}>Koi entry nahi hai abhi.</div>
        )}
        {entries.map(e=>(
          <div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0F172A",borderRadius:8,padding:"10px 12px",marginBottom:6,border:"1px solid #334155"}}>
            <div>
              <div style={{fontSize:13,fontWeight:700}}>{e.description}</div>
              <div style={{fontSize:10,color:"#64748B"}}>{formatDate(e.date)}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{fontSize:14,fontWeight:800,color:e.type==='income'?"#10B981":"#F87171"}}>
                {e.type==='income'?'+':'-'}₹{Number(e.amount).toLocaleString('en-IN')}
              </div>
              <button onClick={()=>deleteEntry(e.id)} style={{background:"none",border:"none",color:"#475569",fontSize:16,cursor:"pointer"}}>✕</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
