<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoreBiz - Orders</title>
<meta name="theme-color" content="#0F172A">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F172A;color:#fff;font-family:system-ui,sans-serif;min-height:100vh}
</style>
</head>
<body>
<div id="authGate" style="position:fixed;inset:0;background:#0F172A;color:#fff;display:flex;align-items:center;justify-content:center;z-index:99999;font-size:14px;">Checking login...</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import { getFirestore, doc, updateDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDJRsJMU-jfy2iQoZsCVZGmyMT-l9mEMf8",
    authDomain: "corebiz-f7762.firebaseapp.com",
    projectId: "corebiz-f7762",
    storageBucket: "corebiz-f7762.firebasestorage.app",
    messagingSenderId: "928975624139",
    appId: "1:928975624139:web:c24e248984883a3a3O484e",
    measurementId: "G-33FSED87HM"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  window.CB_DB = db;
  window.CB_DOC = doc; window.CB_UPDDOC = updateDoc; window.CB_DELDOC = deleteDoc;
  window.CB_COL = collection; window.CB_GETDOCS = getDocs;
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "login.html"; return; }
    window.CB_UID = user.uid;
    const gate = document.getElementById('authGate'); if (gate) gate.style.display = 'none';
    window.CB_READY = true;
    window.dispatchEvent(new Event('cbReady'));
  });
</script>

<div id="root"></div>

<script type="text/babel">
const S = {
  card:{background:"#1E293B",borderRadius:12,padding:"14px",border:"1px solid #334155",marginBottom:12},
  btnGhost:{background:"#0F172A",border:"1px solid #334155",borderRadius:8,padding:"8px 12px",color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}
};

function App(){
  const[ready,setReady]=React.useState(!!window.CB_READY);
  const[orders,setOrders]=React.useState([]);

  React.useEffect(()=>{
    function init(){ loadOrders(); }
    if(window.CB_READY) init();
    else window.addEventListener('cbReady',init,{once:true});
  },[]);

  async function loadOrders(){
    try{
      const snap=await window.CB_GETDOCS(window.CB_COL(window.CB_DB,'users',window.CB_UID,'orders'));
      const list=[];
      snap.forEach(d=>list.push({id:d.id,...d.data()}));
      list.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
      setOrders(list);
    }catch(e){}
    setReady(true);
  }

  async function markDone(id){
    try{
      await window.CB_UPDDOC(window.CB_DOC(window.CB_DB,'users',window.CB_UID,'orders',id),{status:'done'});
      loadOrders();
    }catch(e){alert('Update nahi hua.');}
  }

  async function deleteOrder(id){
    if(!confirm('Ye order hatana hai?'))return;
    try{
      await window.CB_DELDOC(window.CB_DOC(window.CB_DB,'users',window.CB_UID,'orders',id));
      loadOrders();
    }catch(e){alert('Delete nahi hua.');}
  }

  function callWhatsapp(phone){
    const p=(phone||'').replace(/\D/g,'');
    window.open('https://wa.me/91'+p.slice(-10),'_blank');
  }

  if(!ready) return <div style={{padding:20,textAlign:"center",color:"#64748B"}}>Loading...</div>;

  const pending=orders.filter(o=>o.status!=='done');
  const done=orders.filter(o=>o.status==='done');

  return(
    <div style={{minHeight:"100vh",background:"#0F172A",padding:14,maxWidth:500,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div style={{fontSize:20,fontWeight:900,color:"#F59E0B"}}>🛒 Orders</div>
        <a href="index.html" style={{color:"#64748B",fontSize:13,textDecoration:"none"}}>← Wapas</a>
      </div>

      <div style={{fontSize:14,fontWeight:800,marginBottom:10}}>Naye Orders ({pending.length})</div>
      {pending.length===0 && <div style={{textAlign:"center",color:"#475569",fontSize:12,padding:20}}>Koi naya order nahi hai.</div>}
      {pending.map(o=>(
        <div key={o.id} style={{...S.card,border:"1px solid #F59E0B"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <div style={{fontSize:14,fontWeight:800}}>{o.custName}</div>
            <div style={{fontSize:14,fontWeight:800,color:"#F59E0B"}}>₹{o.total}</div>
          </div>
          <div style={{fontSize:12,color:"#64748B",marginBottom:8}}>{o.custPhone}</div>
          {(o.items||[]).map((it,i)=>(
            <div key={i} style={{fontSize:12,color:"#CBD5E1",marginBottom:2}}>{it.name} x{it.qty} — ₹{it.qty*it.price}</div>
          ))}
          <div style={{display:"flex",gap:8,marginTop:10}}>
            <button style={{...S.btnGhost,background:"#10B981",color:"#fff",border:"none"}} onClick={()=>callWhatsapp(o.custPhone)}>💬 WhatsApp</button>
            <button style={{...S.btnGhost,background:"#F59E0B",color:"#0F172A",border:"none"}} onClick={()=>markDone(o.id)}>✓ Poora Hua</button>
            <button style={S.btnGhost} onClick={()=>deleteOrder(o.id)}>Hatao</button>
          </div>
        </div>
      ))}

      {done.length>0 && (
        <>
          <div style={{fontSize:14,fontWeight:800,marginTop:20,marginBottom:10,color:"#64748B"}}>Poore Hue ({done.length})</div>
          {done.map(o=>(
            <div key={o.id} style={{...S.card,opacity:0.6}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <div style={{fontSize:13,fontWeight:700}}>{o.custName}</div>
                <div style={{fontSize:13,fontWeight:700}}>₹{o.total}</div>
              </div>
              <div style={{fontSize:11,color:"#64748B"}}>{o.custPhone}</div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
